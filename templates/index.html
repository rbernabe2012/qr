<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Datos de Cliente</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .form-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 1.5rem;
        }
        .logo {
            display: block;
            margin: 0 auto 1.5rem auto;
            max-width: 200px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.5rem;
            color: #555;
        }
 input[type="text"],
        input[type="tel"],
        input[type="email"] {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .disclaimer {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }
        .disclaimer input {
            margin-right: 0.75rem;
            margin-top: 0.2rem;
        }
        .disclaimer label {
            font-size: 0.8rem;
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="form-container">

        <!-- LOGO CORRECTO DESDE EL SUBPATH -->
        <img src="{{ url_for('static', filename='axis_logo.png') }}" alt="Axis Brokers Logo" class="logo">

        <h1>Confirmación de asistencia - Charla Axis Brokers</h1>

        <!-- ACTION CORRECTO -->
        <form action="{{ url_for('submit') }}" method="post">

            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Teléfono:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <div class="disclaimer">
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Autorizo el tratamiento de mis datos personales de acuerdo con la política de privacidad de Axis Brokers.</label>
            </div>

            <input type="submit" value="Enviar">
        </form>
    </div>
</body>
</html>
